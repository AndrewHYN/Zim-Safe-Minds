name: Restore Zim Safe Minds starter
on:
  push:
    paths:
      - 'scripts/starter_payload.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract audited local starter files
        run: |
          python scripts/restore_starter.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import complete Zim Safe Minds demo starter"
            git push origin HEAD:main
          fi
