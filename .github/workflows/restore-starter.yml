name: Restore Zim Safe Minds starter
on:
  push:
    paths:
      - 'scripts/starter_part_5.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the starter source safely
        run: python scripts/restore_starter.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit verified project source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import complete Zim Safe Minds demo starter"
            git push origin HEAD:main
          fi
